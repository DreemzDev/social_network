{% load static %}
<div class="flex flex-wrap items-center gap-3 rounded-xl border border-gray-100 bg-white p-3 transition hover:border-gray-200 hover:shadow-sm dark:border-zinc-800 dark:bg-zinc-900 dark:hover:border-zinc-700 sm:flex-nowrap">
  <a href="{% url 'addpost' p.username %}" class="relative flex-shrink-0">
    <img
      class="h-14 w-14 rounded-full object-cover"
      src="{% if p.avatar %}{{ p.avatar.url }}{% else %}{% static '/img/avatar7.png' %}{% endif %}"
      alt="{{ p.first_name }} {{ p.last_name }}"
    />
    <span class="absolute bottom-0 right-0 h-3.5 w-3.5 rounded-full border-2 border-white dark:border-zinc-900 {% if p.is_online %}bg-green-400{% else %}bg-gray-300 dark:bg-zinc-600{% endif %}"></span>
  </a>

  <div class="min-w-0 flex-1 sm:w-56 sm:flex-shrink-0 sm:flex-none">
    <a href="{% url 'addpost' p.username %}" class="block truncate text-sm font-medium text-gray-900 hover:text-[#0077FF] dark:text-white">
      {{ p.first_name }} {{ p.last_name }}
    </a>
    <div class="truncate text-xs text-gray-500 dark:text-gray-400">{{ p.rank }}</div>
    {% if p.cat %}
    <span class="mt-1 inline-flex max-w-full items-center truncate rounded-full bg-[#EAF3FF] px-2 py-0.5 text-xs font-medium text-[#0077FF] dark:bg-zinc-800 sm:hidden">
      {{ p.cat.name }}
    </span>
    {% endif %}
  </div>

  <div class="order-4 hidden min-w-0 sm:order-none sm:flex sm:w-40 sm:flex-shrink-0 sm:items-center">
    {% if p.cat %}
    <span class="inline-flex max-w-full items-center whitespace-nowrap rounded-full bg-[#EAF3FF] px-2 py-0.5 text-xs font-medium text-[#0077FF] dark:bg-zinc-800" title="{{ p.cat.name }}">
      {{ p.cat.name }}
    </span>
    {% else %}
    <span class="text-xs text-gray-400 whitespace-nowrap">Отдел не указан</span>
    {% endif %}
  </div>

  <div class="order-4 hidden min-w-0 flex-1 truncate text-sm text-gray-600 dark:text-gray-300 sm:order-none sm:block">
    {{ p.position|default:"Должность не указана" }}
  </div>

  <div class="flex h-9 w-9 flex-shrink-0 items-center justify-center">
    {% if p.pk and request.user.pk != p.pk %}
    <a
      href="{% url 'dialog_messages' user_id=p.pk %}"
      title="Написать сообщение"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-zinc-800"
    >
      <svg class="h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
      </svg>
    </a>
    {% endif %}
  </div>
</div>
