<div class="rounded-xl border border-gray-100 bg-white p-3 dark:border-zinc-700 dark:bg-zinc-900">
  <div class="mb-2 flex items-center justify-between px-1">
    <span class="text-sm font-semibold text-gray-900 dark:text-white">Категории</span>
  </div>
  <ul class="space-y-0.5">
{% for c in cats %}
  <li class="rounded-lg
             {% if c.id == current_cat_id %}
               bg-[#EAF3FF] dark:bg-zinc-800
             {% else %}
               hover:bg-gray-100 dark:hover:bg-zinc-800
             {% endif %}">
    <a
      class="block px-2 py-1.5 text-sm
             {% if c.id == current_cat_id %}
               font-semibold text-[#0077FF]
             {% else %}
               text-gray-700 dark:text-gray-300
             {% endif %}"
      href="{{ c.get_absolute_url }}"
    >
      {{ c.name }}
    </a>
  </li>
{% endfor %}
  </ul>
  {% if current_cat_id %}
  <div class="mt-2 border-t border-gray-100 pt-2 dark:border-zinc-700">
    <a
      href="{% url 'home' %}"
      class="flex items-center justify-between rounded-lg px-2 py-1.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-zinc-800">
      <span>Сбросить фильтр</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
    </a>
  </div>
  {% endif %}
</div>
