{% load static %}
<!-- Кнопка "Есть новые посты" рендерится только на странице ленты новостей
     (см. index.html), а не здесь — includes/posts/post.html переиспользуется и
     на "Моей странице", где эта кнопка не нужна. Разметку и обработчик клика
     ищите в index.html; WS-событие post_created ниже просто её показывает,
     если элемент присутствует на странице. -->

<div class="space-y-6 flex flex-col mx-auto w-full" id="posts-list">
  {% include "includes/posts/list_fragment.html" %}
</div>

<!-- Modal удаления поста (общая на всю ленту, не дублируется на карточку) -->
<div id="popup-modal" tabindex="-1" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full inset-0 h-full">
  <div class="relative p-4 w-full max-w-md max-h-full">
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
      <button type="button" class="absolute top-3 right-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8" data-modal-hide="popup-modal">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
      </button>
      <div class="p-6 text-center">
        <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" fill="none" viewBox="0 0 20 20"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 11-18 0 9 9 0 0118 0Z"/></svg>
        <h3 class="mb-5 text-lg font-normal text-gray-500 dark:text-gray-400">Вы уверены, что хотите удалить этот пост?</h3>

        <form id="delete-post-form" method="POST">
          {% csrf_token %}
          <button type="submit" class="text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center mr-2">
            Да, удалить
          </button>
          <button data-modal-hide="popup-modal" type="button" class="text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600">
            Отмена
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/poll.js' %}"></script>

<!-- Инициализация Lightbox -->
<script>
  lightbox.option({
    'resizeDuration': 200,
    'wrapAround': true,
    'imageFadeDuration': 300,
    'positionFromTop': 50,
    'showImageNumberLabel': true,
    'alwaysShowNavOnTouchDevices': true,
    'fitImagesInViewport': true,
    'maxWidth': 1200,
    'maxHeight': 800
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const postsList = document.getElementById('posts-list');
    const deleteForm = document.getElementById("delete-post-form");
    let currentPostId = null;

    // Делегирование через один слушатель на контейнере — работает и для
    // карточек, добавленных позже (кнопка "Есть новые посты"), а не только
    // для тех, что были в разметке при первой загрузке страницы.
    postsList.addEventListener('click', function (e) {
      const deleteBtn = e.target.closest('.delete-post-btn');
      if (!deleteBtn) return;
      currentPostId = deleteBtn.getAttribute('data-post-id');
      deleteForm.setAttribute('action', `/deletepost/${currentPostId}/`);
    });

    deleteForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const csrfToken = deleteForm.querySelector("input[name='csrfmiddlewaretoken']").value;
      const postElement = document.getElementById(`post-${currentPostId}`);

      fetch(`/deletepost/${currentPostId}/`, {
        method: "POST",
        headers: {
          "X-CSRFToken": csrfToken,
          "X-Requested-With": "XMLHttpRequest",
        },
      }).then(response => {
        if (response.ok) {
          postElement.classList.add("fade-out");

          setTimeout(() => {
            postElement.remove();

            const modalEl = document.getElementById("popup-modal");
            if (modalEl && typeof Modal !== "undefined") {
              const modalInstance = new Modal(modalEl);
              modalInstance.hide();
            }
          }, 300);
        } else {
          alert("Ошибка при удалении поста");
        }
      }).catch(error => {
        console.error("Ошибка:", error);
        alert("Не удалось удалить пост.");
      });
    });
  });
</script>

<!-- Живая лента: новые посты (кнопка — только если она есть на странице,
     см. index.html), счётчики лайков/комментариев (на всех страницах,
     включающих этот partial, в т.ч. "Моя страница") -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const postsList = document.getElementById('posts-list');
    if (!postsList) return;

    const newPostsButton = document.getElementById('new-posts-button');

    function firstPostId() {
      const first = postsList.querySelector('[data-post-id]');
      return first ? first.dataset.postId : null;
    }

    let hasPendingNewPosts = false;

    if (newPostsButton) {
      newPostsButton.addEventListener('click', function () {
        const lastId = firstPostId();
        if (!lastId) return;

        fetch(`/posts/new-since/${lastId}/`)
          .then((response) => response.json())
          .then((data) => {
            if (data.count > 0) {
              postsList.insertAdjacentHTML('afterbegin', data.html);
            }
            newPostsButton.classList.add('hidden');
            hasPendingNewPosts = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          })
          .catch(() => alert('Не удалось загрузить новые посты'));
      });
    }

    function connectFeedSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${protocol}://${window.location.host}/ws/feed/`);

      socket.addEventListener('message', function (event) {
        const data = JSON.parse(event.data);

        if (data.type === 'post_created') {
          if (newPostsButton && !hasPendingNewPosts) {
            hasPendingNewPosts = true;
            newPostsButton.classList.remove('hidden');
          }
        }

        if (data.type === 'post_like_toggled') {
          const article = postsList.querySelector(`[data-post-id="${data.post_id}"]`);
          if (!article) return;
          const countEl = article.querySelector('.likes-count');
          if (countEl) {
            countEl.textContent = data.likes_count > 0 ? data.likes_count : '';
            countEl.onclick = data.likes_count > 0
              ? function () { openLikersModal(`/post/${data.post_id}/likers/`); }
              : null;
          }
        }

        if (data.type === 'post_comment_count_changed') {
          const article = postsList.querySelector(`[data-post-id="${data.post_id}"]`);
          if (!article) return;
          const countEl = article.querySelector('.post-comments-count');
          if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent, 10) + data.delta);
        }

        if (data.type === 'post_deleted') {
          const article = postsList.querySelector(`[data-post-id="${data.post_id}"]`);
          if (article) article.remove();
        }
      });

      socket.addEventListener('close', function () {
        setTimeout(connectFeedSocket, 3000);
      });
    }

    connectFeedSocket();
  });
</script>
