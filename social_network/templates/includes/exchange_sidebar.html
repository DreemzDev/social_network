<div class="rounded-xl border border-gray-100 bg-white p-3 dark:border-zinc-700 dark:bg-zinc-900">
  <div class="mb-2 flex items-center justify-between px-1">
    <span class="text-sm font-semibold text-gray-900 dark:text-white">Обменник</span>
  </div>
  <ul class="space-y-0.5">
    <li class="rounded-lg {% if active == 'folders' %}bg-[#EAF3FF] dark:bg-zinc-800{% else %}hover:bg-gray-100 dark:hover:bg-zinc-800{% endif %}">
      <a class="flex items-center gap-2 px-2 py-1.5 text-sm {% if active == 'folders' %}font-semibold text-[#0077FF]{% else %}text-gray-700 dark:text-gray-300{% endif %}"
         href="{% url 'exchange_inbox' %}">
        <i data-feather="users" class="w-4 h-4"></i> Все папки
      </a>
    </li>
    <li class="rounded-lg {% if active == 'my' %}bg-[#EAF3FF] dark:bg-zinc-800{% else %}hover:bg-gray-100 dark:hover:bg-zinc-800{% endif %}">
      <a class="flex items-center gap-2 px-2 py-1.5 text-sm {% if active == 'my' %}font-semibold text-[#0077FF]{% else %}text-gray-700 dark:text-gray-300{% endif %}"
         href="{% url 'exchange_folder' request.user.pk %}">
        <i data-feather="folder" class="w-4 h-4"></i> Моя папка
      </a>
    </li>
    <li class="rounded-lg {% if active == 'trash' %}bg-[#EAF3FF] dark:bg-zinc-800{% else %}hover:bg-gray-100 dark:hover:bg-zinc-800{% endif %}">
      <a class="flex items-center gap-2 px-2 py-1.5 text-sm {% if active == 'trash' %}font-semibold text-[#0077FF]{% else %}text-gray-700 dark:text-gray-300{% endif %}"
         href="{% url 'exchange_trash' %}">
        <i data-feather="trash" class="w-4 h-4"></i> Корзина
      </a>
    </li>
  </ul>
  <div class="border-t border-gray-100 mt-3 pt-3 px-1 dark:border-zinc-700">
    <p class="text-xs text-gray-500 dark:text-gray-400">
      Файлы удаляются автоматически через 7 дней после загрузки.
    </p>
  </div>
</div>
