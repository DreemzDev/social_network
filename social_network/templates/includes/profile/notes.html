{% load static %}
<div class="sidebar-panel box dark:bg-zinc-900" data-panel-id="notes">
  <div class="sidebar-panel__header flex cursor-grab items-center justify-between p-4 active:cursor-grabbing">
    <div class="flex items-center gap-2 text-base font-semibold text-gray-900 dark:text-white">
      <i data-feather="move" class="h-4 w-4 text-gray-300 dark:text-zinc-600"></i>
      <i data-feather="edit-3" class="h-5 w-5"></i> Заметки
    </div>
    <button type="button" class="sidebar-panel__toggle p-1 text-gray-400 hover:text-gray-600">
      <i data-feather="chevron-down" class="h-4 w-4 transition-transform"></i>
    </button>
  </div>
  <div class="sidebar-panel__content px-4 pb-4">

    <button type="button" id="note-add-btn" class="mb-3 inline-flex items-center gap-1.5 rounded-lg bg-[#0077FF] px-3 py-1.5 text-sm font-medium text-white hover:bg-[#3391FF]">
      <i data-feather="plus" class="h-3.5 w-3.5"></i> Новая заметка
    </button>

    <div id="notes-grid" class="grid grid-cols-2 gap-3">
      {% for note in notes %}
      <div class="note-card note-color-{{ note.color }} group relative flex min-h-[110px] flex-col rounded-lg p-3 shadow-sm" data-note-id="{{ note.id }}" data-color="{{ note.color }}">
        <div class="note-card-content mb-2 flex-1 whitespace-pre-wrap break-words text-sm text-gray-800">{{ note.content }}</div>
        <div class="flex items-center justify-between">
          <div class="note-color-picker flex items-center gap-1">
            {% for value, label in note_form.color.field.choices %}
            <button type="button" class="note-color-dot h-3.5 w-3.5 rounded-full note-swatch-{{ value }} {% if value == note.color %}ring-2 ring-offset-1 ring-gray-500{% endif %}" data-color="{{ value }}" title="{{ label }}"></button>
            {% endfor %}
          </div>
          <div class="flex items-center gap-2 opacity-0 transition-opacity group-hover:opacity-100">
            <button type="button" class="note-edit-btn text-gray-500 hover:text-gray-800">
              <i data-feather="edit-2" class="h-3.5 w-3.5"></i>
            </button>
            <button type="button" class="note-delete-btn text-gray-500 hover:text-red-500">
              <i data-feather="x" class="h-3.5 w-3.5"></i>
            </button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div id="no-notes-placeholder" class="flex flex-col items-center gap-2 py-6 text-center" {% if notes %}style="display:none"{% endif %}>
      <i data-feather="edit-3" class="h-8 w-8 text-gray-200 dark:text-zinc-700"></i>
      <span class="text-sm text-gray-400">Нет заметок</span>
    </div>
  </div>
</div>

<!-- Модалка создания/редактирования заметки -->
<div id="note-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-5 dark:bg-zinc-900">
    <div class="mb-4 flex items-center justify-between">
      <div id="note-modal-title" class="text-base font-semibold text-gray-900 dark:text-white">Новая заметка</div>
      <button type="button" id="note-modal-close" class="text-gray-400 hover:text-gray-600">
        <i data-feather="x" class="h-5 w-5"></i>
      </button>
    </div>
    <form id="note-modal-form" class="space-y-3">
      <div>
        <textarea id="note-modal-content" rows="5" placeholder="Текст заметки..."
                  class="block w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-base text-gray-900 focus:border-[#0077FF] focus:ring-[#0077FF] dark:border-zinc-600 dark:bg-zinc-800 dark:text-white"></textarea>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Цвет</label>
        <div id="note-modal-colors" class="flex items-center gap-2">
          {% for value, label in note_form.color.field.choices %}
          <button type="button" class="note-modal-color-btn h-6 w-6 rounded-full note-swatch-{{ value }}" data-color="{{ value }}" title="{{ label }}"></button>
          {% endfor %}
        </div>
        <input type="hidden" id="note-modal-color-input" value="yellow">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="note-modal-cancel" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-zinc-600 dark:text-gray-200 dark:hover:bg-zinc-800">Отмена</button>
        <button type="submit" class="rounded-lg bg-[#0077FF] px-4 py-2 text-sm font-medium text-white hover:bg-[#3391FF]">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<style>
  .note-color-yellow { background: #FFF6BF; }
  .note-color-pink { background: #FFDCE8; }
  .note-color-blue { background: #D6ECFF; }
  .note-color-green { background: #DFF6DD; }
  .note-color-purple { background: #EAE0FF; }

  .note-swatch-yellow { background: #FDE68A; }
  .note-swatch-pink { background: #FBB6CE; }
  .note-swatch-blue { background: #93C5FD; }
  .note-swatch-green { background: #86EFAC; }
  .note-swatch-purple { background: #C4B5FD; }

  .note-modal-color-btn.active { box-shadow: 0 0 0 2px #0077FF; }
</style>

<script>
  (function () {
    const csrfToken = '{{ csrf_token }}';
    const grid = document.getElementById('notes-grid');
    const placeholder = document.getElementById('no-notes-placeholder');

    function updatePlaceholder() {
      placeholder.style.display = grid.children.length ? 'none' : '';
    }

    const COLOR_CHOICES = [
      {% for value, label in note_form.color.field.choices %}['{{ value }}', '{{ label|escapejs }}'],{% endfor %}
    ];

    function buildNoteCard(note) {
      const card = document.createElement('div');
      card.className = 'note-card note-color-' + note.color + ' group relative flex min-h-[110px] flex-col rounded-lg p-3 shadow-sm';
      card.dataset.noteId = note.id;
      card.dataset.color = note.color;

      const content = document.createElement('div');
      content.className = 'note-card-content mb-2 flex-1 whitespace-pre-wrap break-words text-sm text-gray-800';
      content.textContent = note.content;
      card.appendChild(content);

      const footer = document.createElement('div');
      footer.className = 'flex items-center justify-between';

      const colorPicker = document.createElement('div');
      colorPicker.className = 'note-color-picker flex items-center gap-1';
      COLOR_CHOICES.forEach(function ([value]) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'note-color-dot h-3.5 w-3.5 rounded-full note-swatch-' + value + (value === note.color ? ' ring-2 ring-offset-1 ring-gray-500' : '');
        dot.dataset.color = value;
        colorPicker.appendChild(dot);
      });
      footer.appendChild(colorPicker);

      const actions = document.createElement('div');
      actions.className = 'flex items-center gap-2 opacity-0 transition-opacity group-hover:opacity-100';
      actions.innerHTML =
        '<button type="button" class="note-edit-btn text-gray-500 hover:text-gray-800"><i data-feather="edit-2" class="h-3.5 w-3.5"></i></button>' +
        '<button type="button" class="note-delete-btn text-gray-500 hover:text-red-500"><i data-feather="x" class="h-3.5 w-3.5"></i></button>';
      footer.appendChild(actions);

      card.appendChild(footer);
      if (window.feather) feather.replace({ width: '14', height: '14' });
      return card;
    }

    // --- Модалка ---
    const modal = document.getElementById('note-modal');
    const modalTitleLabel = document.getElementById('note-modal-title');
    const modalForm = document.getElementById('note-modal-form');
    const modalContent = document.getElementById('note-modal-content');
    const modalColorInput = document.getElementById('note-modal-color-input');
    const modalColorBtns = document.querySelectorAll('.note-modal-color-btn');
    let editingCard = null;

    function setModalColor(color) {
      modalColorInput.value = color;
      modalColorBtns.forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.color === color);
      });
    }

    modalColorBtns.forEach(function (btn) {
      btn.addEventListener('click', function () { setModalColor(btn.dataset.color); });
    });

    function openCreateModal() {
      editingCard = null;
      modalTitleLabel.textContent = 'Новая заметка';
      modalContent.value = '';
      setModalColor('yellow');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      modalContent.focus();
    }

    function openEditModal(card) {
      editingCard = card;
      modalTitleLabel.textContent = 'Редактировать заметку';
      modalContent.value = card.querySelector('.note-card-content').textContent;
      setModalColor(card.dataset.color);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      modalContent.focus();
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      editingCard = null;
    }

    document.getElementById('note-add-btn').addEventListener('click', openCreateModal);
    document.getElementById('note-modal-close').addEventListener('click', closeModal);
    document.getElementById('note-modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', function (event) { if (event.target === modal) closeModal(); });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
    });

    modalForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const isEdit = !!editingCard;
      const url = isEdit ? '/note/' + editingCard.dataset.noteId + '/edit/' : '/note/create/';

      const body = new URLSearchParams();
      body.set('content', modalContent.value);
      body.set('color', modalColorInput.value);

      fetch(url, {
        method: 'POST',
        headers: {
          'X-CSRFToken': csrfToken,
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: body.toString(),
      })
        .then((r) => r.json())
        .then((data) => {
          if (!data.success) return;

          if (isEdit) {
            const newCard = buildNoteCard(data.note);
            editingCard.replaceWith(newCard);
          } else {
            const newCard = buildNoteCard(data.note);
            grid.appendChild(newCard);
            updatePlaceholder();
          }
          closeModal();
        });
    });

    function updateColor(card, color) {
      const noteId = card.dataset.noteId;
      fetch('/note/' + noteId + '/edit/', {
        method: 'POST',
        headers: {
          'X-CSRFToken': csrfToken,
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'content=' + encodeURIComponent(card.querySelector('.note-card-content').textContent) + '&color=' + encodeURIComponent(color),
      })
        .then((r) => r.json())
        .then((data) => {
          if (!data.success) return;
          const newCard = buildNoteCard(data.note);
          card.replaceWith(newCard);
        });
    }

    function deleteNote(card) {
      const noteId = card.dataset.noteId;
      fetch('/note/' + noteId + '/delete/', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrfToken },
      }).then(() => {
        card.remove();
        updatePlaceholder();
      });
    }

    grid.addEventListener('click', function (event) {
      const card = event.target.closest('.note-card');
      if (!card) return;

      const colorDot = event.target.closest('.note-color-dot');
      if (colorDot) {
        updateColor(card, colorDot.dataset.color);
        return;
      }

      const editBtn = event.target.closest('.note-edit-btn');
      if (editBtn) {
        openEditModal(card);
        return;
      }

      const deleteBtn = event.target.closest('.note-delete-btn');
      if (deleteBtn) {
        deleteNote(card);
      }
    });

    updatePlaceholder();
  })();
</script>
