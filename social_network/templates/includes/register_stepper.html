{% comment %}Ожидает переменную current_step (1 или 2){% endcomment %}
<div class="mb-6 flex items-center justify-center gap-2">
    <div class="flex items-center gap-2">
        <span class="flex h-7 w-7 items-center justify-center rounded-full text-sm font-semibold
            {% if current_step >= 1 %}bg-[#0077FF] text-white{% else %}bg-gray-200 text-gray-500 dark:bg-zinc-700{% endif %}">
            {% if current_step > 1 %}
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 16 12">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5.917 5.724 10.5 15 1.5"/>
            </svg>
            {% else %}1{% endif %}
        </span>
        <span class="text-sm {% if current_step == 1 %}font-medium text-gray-900 dark:text-white{% else %}text-gray-400{% endif %}">Аккаунт</span>
    </div>
    <div class="h-px w-8 bg-gray-200 dark:bg-zinc-700"></div>
    <div class="flex items-center gap-2">
        <span class="flex h-7 w-7 items-center justify-center rounded-full text-sm font-semibold
            {% if current_step >= 2 %}bg-[#0077FF] text-white{% else %}bg-gray-200 text-gray-500 dark:bg-zinc-700{% endif %}">2</span>
        <span class="text-sm {% if current_step == 2 %}font-medium text-gray-900 dark:text-white{% else %}text-gray-400{% endif %}">Ваше имя</span>
    </div>
</div>
