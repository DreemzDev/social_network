# Прод-конфигурация nginx для портала «Сеть-УК» (Astra Linux).
#
# Куда класть:  /etc/nginx/conf.d/portal.conf
# Этот каталог подключается директивой include внутри http{}, поэтому здесь
# нет блоков http/events, а map ниже стоит на правильном уровне.
#
# Что поменять при разворачивании: PORTAL_ROOT — каталог, в котором лежит
# manage.py (он же settings.BASE_DIR). Ниже он подставлен как /srv/portal,
# встречается в четырёх alias'ах.
#
# DEBUG в settings.py на проде обязан быть False: именно по нему
# StorageService.get_download_response() выбирает ветку с X-Accel-Redirect.
# При DEBUG=True Django отдаёт файл сам через FileResponse, занимая воркер
# Daphne на всё время скачивания.
#
# Локальная Windows-копия для проверки — nginx-1.28.0/conf/nginx.conf; она
# вне git (каталог в .gitignore). Блоки /protected/ и /media/storage/ в обоих
# файлах обязаны совпадать по смыслу — за этим следит
# apps/storage/tests/test_x_accel_redirect.py.

# Connection: upgrade должен уходить только на самом WebSocket-рукопожатии.
# Прошитое значение "upgrade" на все проксируемые запросы ломает keep-alive
# обычным HTTP-ответам.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name social.uk.ru www.social.uk.ru;

    access_log /var/log/nginx/portal-access.log;
    error_log  /var/log/nginx/portal-error.log;

    # Чуть больше STORAGE_MAX_UPLOAD_SIZE (100 МБ): тело multipart-запроса
    # длиннее самого файла на границы и заголовки частей, поэтому при равных
    # значениях файл ровно в 100 МБ отбивался бы nginx'ом (413 и его
    # собственная страница ошибки) вместо понятного сообщения от Django.
    client_max_body_size 110M;

    # Статика Django, settings.STATIC_URL = 'app/static/'.
    location /app/static/ {
        alias /srv/portal/static/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # --- storage: отдача файлов после проверки прав ------------------------
    #
    # Внутренний location для X-Accel-Redirect. Права проверяет вьюха
    # модуля-потребителя, после чего StorageService.get_download_response()
    # отдаёт пустой ответ с этим заголовком, а файл читает уже nginx — воркер
    # Daphne не занят на всё время скачивания (ARCHITECTURE.md, раздел 8).
    #
    # alias — именно MEDIA_ROOT, а не .../storage/blobs/:
    # get_download_response() считает путь относительно MEDIA_ROOT и отдаёт
    # заголовок вида /protected/storage/blobs/ab/<checksum>. С alias на blobs/
    # путь удвоился бы (media/storage/blobs/storage/blobs/...).
    location /protected/ {
        internal;
        alias /srv/portal/media/;
        add_header X-Content-Type-Options "nosniff";
    }

    # ОБЯЗАТЕЛЬНО: закрыть прямой доступ к blob'ам.
    # Перехватчик ^media/storage/ в корневом urls.py работает только когда
    # медиа раздаёт Django, то есть при DEBUG=True. Как только перед
    # приложением встаёт nginx с обычным location /media/, файл скачивается по
    # прямой ссылке /media/storage/blobs/<checksum> в обход всех проверок прав
    # модуля-потребителя.
    # Правило длиннее, чем /media/, поэтому по правилу самого длинного
    # префикса nginx выбирает именно его.
    location /media/storage/ {
        deny all;
        access_log off;
    }

    # Медиа Django — то, что лежит вне storage и публично по своей природе:
    # аватары, картинки постов, галерея (ARCHITECTURE.md, 1.1).
    location /media/ {
        alias /srv/portal/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /srv/portal/static/img/favicon.ico;
        expires 30d;
    }

    # Приложение: Daphne/ASGI на 127.0.0.1:8000 (WebSocket-чат и живые
    # обновления файлового менеджера идут этим же маршрутом).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
